<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Counter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 20px; }
        .counter-box {
            background: #eef2f3;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .counter-value {
            font-size: 3rem;
            font-weight: bold;
            color: #2e7d32; /* Vibrant Green */
            margin: 10px 0;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover { background-color: #0056b3; }
        
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        .btn-danger:hover { background-color: #bd2130; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Live Traffic Monitor</h1>
        <p style="color: #7f8c8d;">Shared Redis Database Counter</p>
        
        <div class="counter-box">
            <div class="counter-value">{{ hit_count }}</div>
            <p style="margin: 0; color: #555; font-size: 0.95rem;">Total Page Hits</p>
        </div>

        <div class="btn-container">
            <a href="/count" class="btn btn-primary">🔄 Increment Count</a>
            <a href="/reset" class="btn btn-danger">🗑️ Reset Counter</a>
        </div>
    </div>
</body>
</html>
